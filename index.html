<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#10111b"><title>Nova AI</title>
<style>
:root{color-scheme:dark;--bg:#10111b;--panel:#191b29;--line:#2b2e42;--text:#f5f6ff;--muted:#a5a8c0;--accent:#8a6cff;--accent2:#36d7c3}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20213b 0%,var(--bg) 48%);font-family:system-ui,sans-serif;color:var(--text);min-height:100dvh}.app{max-width:780px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:14px}
header{display:flex;align-items:center;gap:11px;padding:10px 4px 16px;border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:22px;font-weight:900;color:#111}.brand{font-weight:800;font-size:18px}.sub{font-size:12px;color:var(--muted)}.status{margin-left:auto;font-size:11px;color:var(--accent2);border:1px solid #28534f;border-radius:30px;padding:6px 9px}
main{flex:1;padding:18px 0 10px;display:flex;flex-direction:column;gap:12px}.welcome{padding:25px 18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#1b1d30,#151622);text-align:center}.welcome h1{font-size:25px;margin:0 0 8px}.welcome p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}.suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}.suggestions button{background:#22243a;border:1px solid #383b56;color:#e6e6ff;padding:9px 11px;border-radius:12px}
.message{max-width:90%;padding:12px 14px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:14px}.user{align-self:flex-end;background:linear-gradient(135deg,#6250ca,#4e47a6);border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}.preview{max-width:150px;max-height:130px;border-radius:10px;display:block;margin-top:8px}
.composer-wrap{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%);padding:12px 0 5px}.attachments{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}.filetag{font-size:12px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 9px;color:var(--muted)}.composer{display:flex;gap:8px;align-items:flex-end;background:#1a1b2a;border:1px solid #37394f;padding:8px;border-radius:20px}.iconbtn{flex:0 0 40px;width:40px;height:40px;border:0;border-radius:13px;background:#292b40;color:white;font-size:22px}textarea{resize:none;min-height:40px;max-height:130px;flex:1;border:0;outline:0;background:transparent;color:white;padding:10px 2px;font:inherit;font-size:14px}.send{background:linear-gradient(135deg,var(--accent),#6358da);font-size:18px}.footer{text-align:center;color:#777b96;font-size:10px;padding:8px 0 2px}.modebar{display:flex;gap:8px;margin-bottom:10px}.mode{flex:1;padding:10px;border:1px solid var(--line);border-radius:12px;background:#191b29;color:#b9bbd2}.mode.active{border-color:var(--accent);color:white;background:#282344}.hidden{display:none!important}@media(min-width:650px){.app{padding:20px}.welcome{margin:30px 40px}.message{max-width:80%}}
</style></head><body><div class="app">
<header><div class="logo">N</div><div><div class="brand">Nova AI</div><div class="sub">AI Chat · ছবি বুঝতে পারে</div></div><div class="status" id="status">সংযোগ হচ্ছে…</div></header>
<div class="modebar"><button class="mode active" id="chatMode">✦ AI Chat</button><button class="mode" id="videoMode">▶ AI Video</button></div>
<main id="chat"><section class="welcome" id="welcome"><h1>কীভাবে সাহায্য করতে পারি?</h1><p>প্রশ্ন লিখুন, ছবি যুক্ত করুন, অথবা কোনো কাজ বুঝিয়ে বলুন।</p><div class="suggestions"><button data-prompt="আমাকে বাংলায় একটি সুন্দর ক্যাপশন লিখে দাও">✍️ ক্যাপশন লিখুন</button><button data-prompt="পড়াশোনার একটি সহজ পরিকল্পনা বানাও">📚 পড়াশোনা</button><button data-prompt="একটি AI ভিডিওর জন্য সৃজনশীল prompt লিখে দাও">🎬 ভিডিও আইডিয়া</button></div></section></main>
<section id="videoPanel" class="hidden"><div class="welcome"><h1>🎬 AI Video Studio</h1><p>ভিডিওর ধারণা লিখুন। ভিডিও API যুক্ত না হওয়া পর্যন্ত আসল ভিডিও তৈরি হবে না।</p></div><div class="composer"><textarea id="videoPrompt" placeholder="যেমন: বৃষ্টির দিনে ঢাকার রাস্তার সিনেমাটিক দৃশ্য…" rows="3"></textarea><button class="iconbtn send" id="makeVideo">➤</button></div><div id="videoResult" class="sub" style="padding:12px"></div></section>
<div class="composer-wrap" id="chatComposer"><div id="attachments" class="attachments"></div><div class="composer"><button class="iconbtn" id="attach" aria-label="ফাইল যুক্ত করুন">＋</button><input type="file" id="fileInput" accept="image/*" multiple hidden><textarea id="messageInput" rows="1" placeholder="Nova AI-কে কিছু জিজ্ঞেস করুন…"></textarea><button class="iconbtn send" id="send" aria-label="পাঠান">➤</button></div><div class="footer">API key server-এ রাখুন · starter app</div></div></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('messageInput'),send=document.getElementById('send'),filesInput=document.getElementById('fileInput'),attachmentBox=document.getElementById('attachments');let chosen=[],history=[];const welcome=document.getElementById('welcome');
function addMessage(text,role,images=[]){const el=document.createElement('div');el.className='message '+role;el.textContent=text;for(const f of images){const tag=document.createElement('div');tag.textContent='📎 '+f.name;el.appendChild(tag);if(f.type.startsWith('image/')){const img=document.createElement('img');img.className='preview';img.src=URL.createObjectURL(f);img.alt=f.name;el.appendChild(img)}}chat.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'end'});return el}
function renderFiles(){attachmentBox.replaceChildren();chosen.forEach((f,i)=>{const t=document.createElement('span');t.className='filetag';t.textContent='📎 '+f.name+' ×';t.onclick=()=>{chosen.splice(i,1);renderFiles()};attachmentBox.appendChild(t)})}
document.getElementById('attach').onclick=()=>filesInput.click();filesInput.onchange=()=>{chosen=[...chosen,...filesInput.files].slice(0,4);renderFiles();filesInput.value=''};
document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus()});
async function sendMessage(){const message=input.value.trim();if(!message&&!chosen.length)return;welcome.classList.add('hidden');const current=[...chosen];addMessage(message||'সংযুক্ত ছবি সম্পর্কে বলুন','user',current);input.value='';chosen=[];renderFiles();send.disabled=true;const loading=addMessage('উত্তর তৈরি হচ্ছে…','assistant');const form=new FormData();form.append('message',message);form.append('history',JSON.stringify(history));current.forEach(f=>form.append('files',f));try{const r=await fetch('/api/chat',{method:'POST',body:form});const d=await r.json();loading.textContent=d.answer||d.error||'উত্তর পাওয়া যায়নি।';if(r.ok){history.push({role:'user',content:message||'[ছবি সংযুক্ত]'});history.push({role:'assistant',content:d.answer||''});history=history.slice(-10)}}catch{loading.textContent='সার্ভারের সঙ্গে যোগাযোগ হয়নি। অ্যাপ deploy হয়েছে কি না দেখুন।'}finally{send.disabled=false;input.focus()}}
send.onclick=sendMessage;input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};
const cm=document.getElementById('chatMode'),vm=document.getElementById('videoMode'),vp=document.getElementById('videoPanel'),cc=document.getElementById('chatComposer');cm.onclick=()=>{cm.classList.add('active');vm.classList.remove('active');chat.classList.remove('hidden');cc.classList.remove('hidden');vp.classList.add('hidden')};vm.onclick=()=>{vm.classList.add('active');cm.classList.remove('active');chat.classList.add('hidden');cc.classList.add('hidden');vp.classList.remove('hidden')};
document.getElementById('makeVideo').onclick=async()=>{const prompt=document.getElementById('videoPrompt').value.trim(),out=document.getElementById('videoResult');if(!prompt){out.textContent='আগে ভিডিওর বর্ণনা লিখুন।';return}out.textContent='অনুরোধ পাঠানো হচ্ছে…';try{const r=await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await r.json();out.textContent=d.error||'ভিডিও তৈরি হয়নি।'}catch{out.textContent='সার্ভারের সঙ্গে যোগাযোগ হয়নি।'}};
fetch('/api/health').then(r=>r.json()).then(s=>document.getElementById('status').textContent=s.chatConfigured?'AI প্রস্তুত':'API key প্রয়োজন').catch(()=>document.getElementById('status').textContent='Deploy প্রয়োজন');
</script></body></html>
